<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Safety Workplace Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/7.1.0/docx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f9ff; -webkit-tap-highlight-color: transparent; }
        .page { display: none; }
        .page.active { display: block; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 1rem; overflow: hidden; }
        
        /* สไตล์ปุ่มคะแนน */
        .score-btn {
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #cbd5e1; border-radius: 8px;
            background: white; font-weight: bold; cursor: pointer;
            transition: all 0.2s;
        }
        .score-btn.selected { background-color: #2563eb; color: white; border-color: #2563eb; transform: scale(1.1); }
        
        /* สีพื้นหลังแต่ละหมวด */
        .bg-5s { background-color: #e0f2fe; }
        .bg-safety { background-color: #fef9c3; }
        .bg-innovation { background-color: #dcfce7; }
    </style>
</head>
<body>

<div class="max-w-4xl mx-auto p-4 pb-20">
    <header class="text-center mb-6">
        <h1 class="text-2xl font-bold text-blue-600">Smart Safety Assessment</h1>
        <p id="autoSaveLabel" class="text-xs text-gray-500 italic mt-1"></p>
    </header>

    <section id="page1" class="page active">
        <div class="bg-white p-6 card">
            <h2 class="text-xl font-semibold mb-4 text-gray-700"><i class="fas fa-users mr-2"></i>ข้อมูลเบื้องต้น</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">เลือกทีมประเมิน</label>
                    <select id="teamSelect" class="w-full p-3 border rounded-lg bg-gray-50" onchange="updateEvaluatorDropdown()">
                        <option value="">-- เลือกทีม --</option>
                        <option value="1">ทีมประเมินที่ 1</option>
                        <option value="2">ทีมประเมินที่ 2</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">ผู้ประเมิน</label>
                    <select id="evaluatorSelect" class="w-full p-3 border rounded-lg bg-gray-50">
                        <option value="">-- กรุณาเลือกทีมก่อน --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">วันที่ประเมิน</label>
                    <input type="date" id="evalDate" class="w-full p-3 border rounded-lg bg-gray-50">
                </div>
                <button onclick="saveInitialData()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition">
                    บันทึกข้อมูลผู้ประเมิน <i class="fas fa-arrow-right ml-2"></i>
                </button>
                <button onclick="goToPage(3)" class="w-full text-blue-600 font-semibold py-2">
                    <i class="fas fa-history mr-1"></i> ดูประวัติย้อนหลัง
                </button>
            </div>
        </div>
    </section>

    <section id="page2" class="page">
        <div class="flex items-center justify-between mb-4">
            <button onclick="goToPage(1)" class="text-blue-600 font-bold"><i class="fas fa-chevron-left mr-1"></i> กลับ</button>
            <span id="displayEvaluator" class="text-sm font-semibold text-gray-600"></span>
        </div>

        <div class="bg-white p-4 card border-l-4 border-blue-500">
            <label class="block font-bold mb-2">ส่วนที่ 1: พื้นที่ตรวจประเมิน</label>
            <select id="areaSelect" class="w-full p-2 border rounded bg-gray-50"></select>
        </div>

        <div id="assessmentSections" class="space-y-4">
            <div class="bg-5s card p-4">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-blue-900 text-lg">หมวดที่ 1: มาตรฐาน 5ส</h3>
                    <div class="bg-white px-3 py-1 rounded-full font-bold text-blue-600">รวม: <span id="sum5s">0</span></div>
                </div>
                <div id="container5s" class="space-y-4"></div>
            </div>

            <div class="bg-safety card p-4">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-yellow-900 text-lg">หมวดที่ 2: ความปลอดภัยขั้นพื้นฐาน</h3>
                    <div class="bg-white px-3 py-1 rounded-full font-bold text-yellow-600">รวม: <span id="sumSafety">0</span></div>
                </div>
                <div id="containerSafety" class="space-y-4"></div>
            </div>

            <div class="bg-innovation card p-4">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-green-900 text-lg">หมวดที่ 3: นวัตกรรม</h3>
                    <div class="bg-white px-3 py-1 rounded-full font-bold text-green-600">รวม: <span id="sumInno">0</span></div>
                </div>
                <div id="containerInno" class="space-y-4"></div>
            </div>
        </div>

        <div class="bg-white p-4 card mt-4">
            <label class="block font-bold mb-2">รายละเอียดเพิ่มเติม</label>
            <textarea id="notes" class="w-full p-3 border rounded-lg h-24" placeholder="ระบุสิ่งที่พบเจอจากการประเมิน..."></textarea>
        </div>

        <div class="bg-white p-4 card">
            <label class="block font-bold mb-2">แนบรูปถ่าย (สูงสุด 7 รูป)</label>
            <input type="file" id="imgInput" multiple accept="image/*" class="w-full text-sm" onchange="handleImages(this)">
            <div id="preview" class="flex flex-wrap gap-2 mt-3"></div>
        </div>

        <div class="bg-blue-600 p-6 rounded-2xl text-white text-center mt-6 shadow-xl">
            <div class="text-sm opacity-80 uppercase tracking-widest">คะแนนรวมสุทธิ</div>
            <div class="text-5xl font-bold my-2" id="grandTotal">0</div>
            <button onclick="submitAssessment()" class="w-full bg-white text-blue-600 py-4 rounded-xl font-bold text-xl mt-4 hover:bg-gray-100 active:scale-95 transition">
                <i class="fas fa-save mr-2"></i> บันทึกข้อมูล
            </button>
        </div>
    </section>

    <section id="page3" class="page">
        <div class="flex justify-between items-center mb-6">
            <button onclick="goToPage(1)" class="bg-gray-200 p-2 rounded-full px-4"><i class="fas fa-home"></i></button>
            <h2 class="text-xl font-bold">ประวัติการบันทึก</h2>
            <div class="w-8"></div>
        </div>

        <div class="space-y-3 mb-6">
            <div class="flex gap-2">
                <input type="text" id="searchArea" placeholder="ค้นพื้นที่..." class="flex-1 p-2 border rounded-lg">
                <button onclick="renderList()" class="bg-blue-500 text-white px-4 rounded-lg"><i class="fas fa-search"></i></button>
            </div>
        </div>

        <div id="historyList" class="space-y-4"></div>
    </section>
</div>

<script>
    // --- ตั้งค่าข้อมูลเบื้องต้น ---
    const CONFIG = {
        team1: {
            evaluators: ["จิรัฏฐ์ เลียวกิจสิริ", "ยุทธนันท์ อังกูรสุทธิพันธ์", "วิชเลิศ กลิ่นถือศิล", "สลักใจ แพงศรี", "วุฒิภัทร ภิรมย์สุข", "สุมิตรา แจ่มถนอม", "กาญจนา พรกมลวรรณ", "พลัฏฐ์ เลียวกิจสิริ", "ชาตรี บุษราคัมกุล", "เอกราช คล้ายแจ้ง", "อานนท์ สามพ่วงบุญ", "สัญชัย ฉิมอ่อง", "พรพรรณ พงศ์ทองผาสุข", "ชัชชญา คัณฑเขตต์"],
            areas: ["1. เจาะบาก", "2. ตัด/จอดแร๊ค", "3. คลังกระจก", "5. เทมเปอร์ใหญ่", "6. เจียรตั้ง", "7. เจียรนอน", "8. Insulate", "10. Packing", "11. จัดส่ง Zone 1", "12. จัดส่ง Zone 2", "13. ประกบลายผ้า/SPL", "14. ประกบ Bagging", "15. ประกบ-Auto", "16. ถังอัด", "17. ดัดโค้ง", "18. ตัดฟิล์ม+ประกบมือ", "19. CNC", "20. CERAMIC FRIT", "21. พิกเซล-พ่นทราย"]
        },
        team2: {
            evaluators: ["สรวิชญ์ พงษ์เสถียรศักดิ์", "วินัย เปี้ยวเฉียน", "สุพจน์ เปลียวปลอด", "อภิรัตน์ รุ่งเรือง", "เอกราช คล้ายแจ้ง", "ธนวิสุทธิ์ จูเกษม", "วัลภา มณีรัตน์", "สุรศักดิ์ เพียรประดิษฐกุล", "ชญาดา ละอองดี", "อานนท์ แก้วภักดี", "ณฐภัทร ภิญโญสรรพกิจ", "พีณะ รุ่งพรมมา", "อัมภวรรณ ไม้โคกสูง", "อภิชาต แก้วเจริญ", "มนทิพ ปานทน"],
            areas: ["1. ประกันคุณภาพ", "2. QA", "3. วางแผน", "4. พัฒนากระบวนการ", "5. คลังสินค้า", "6. คลังผ้า", "7. วิศวกรรม", "8. Shop วิศวกรรม", "9. แบบมาตรฐาน", "10. Generate", "11. ทรัพยากรบุคคล", "12. MIS", "13. ขาย", "14. จัดซื้อ", "15. บัญชีการเงิน", "16. นวัตกรรม", "17. โรงอาหาร"]
        },
        criteria: {
            sec1: [
                {id: 'c1_1', title: '1. สะสาง (Seiri)', max: 8, steps: [2, 4, 6, 8], desc: ['พบขยะมาก', 'เริ่มแยกไม่มีป้าย', 'แยกชัดมีแผนกำจัด', 'ไม่มีของไม่จำเป็น']},
                {id: 'c1_2', title: '2. สะดวก (Seiton)', max: 8, steps: [2, 4, 6, 8], desc: ['วางระเกะระกะ', 'มีที่วางแต่ไม่มีป้าย', 'ป้ายชื่อเส้นชัดเจน', 'หยิบง่ายคืนถูก 100%']},
                {id: 'c1_3', title: '3. สะอาด (Seiso)', max: 8, steps: [2, 4, 6, 8], desc: ['ฝุ่นหนา/รั่วซึม', 'สะอาดเฉพาะจุดเห็น', 'สะอาดจัดเก็บระเบียบ', 'เงางามทุกจุด']},
                {id: 'c1_4', title: '4. สุขลักษณะ (Seiketsu)', max: 8, steps: [2, 4, 6, 8], desc: ['มีกลิ่น/ฝุ่นสะสม', 'เริ่มมีมาตรฐานบางจุด', 'มีมาตรฐาน/ผู้รับผิดชอบ', 'ควบคุมดีเยี่ยม']},
                {id: 'c1_5', title: '5. สร้างนิสัย (Shitsuke)', max: 8, steps: [2, 4, 6, 8], desc: ['ไม่มีเวรทำความสะอาด', 'ทำไม่สม่ำเสมอ', 'ปฏิบัติตามกฎรอบ', 'ทำต่อเนื่อง/Self-Audit']}
            ],
            sec2: [
                {id: 'c2_1', title: '1. ทางเดิน', max: 5, steps: [2, 4, 5], desc: ['กีดขวาง', 'โล่งแต่เส้นเลือน', 'โล่ง 100% มีเส้นชัด']},
                {id: 'c2_2', title: '2. ระบบไฟฟ้า', max: 5, steps: [2, 4, 5], desc: ['สายยุ่งเหยิง', 'เก็บบ้างแต่ไม่เรียบร้อย', 'ร้อยท่อปลอดภัย']},
                {id: 'c2_3', title: '3. ดับเพลิง', max: 5, steps: [2, 4, 5], desc: ['ไม่พร้อมใช้', 'มีครบแต่มีของบัง', 'พร้อมใช้ 100%']},
                {id: 'c2_4', title: '4. ของหนัก', max: 5, steps: [2, 4, 5], desc: ['วางที่สูงอันตราย', 'วางพื้นไม่ระเบียบ', 'วางถูกหลักปลอดภัย']}
            ],
            sec3: [
                {id: 'c3_1', title: '1. Visual Mgmt', max: 5, steps: [2, 4, 5], desc: ['ป้ายทั่วไป', 'แบ่งโซนสีชัดเจน', 'Poka-Yoke']},
                {id: 'c3_2', title: '2. DIY Solution', max: 5, steps: [2, 4, 5], desc: ['ซื้อสำเร็จ', 'ทำเองแก้ปัญหาได้', 'ลดขั้นตอน/Lean']}
            ]
        }
    };

    let state = { scores: {}, images: [], dbKey: "SmartSafetyWorkplaceAssessmentData" };

    // --- เริ่มต้นระบบ ---
    window.onload = () => {
        document.getElementById('evalDate').valueAsDate = new Date();
        renderAssessmentForm();
        loadAutoSaveInfo();
    };

    function renderAssessmentForm() {
        renderGroup('container5s', CONFIG.criteria.sec1);
        renderGroup('containerSafety', CONFIG.criteria.sec2);
        renderGroup('containerInno', CONFIG.criteria.sec3);
    }

    function renderGroup(containerId, items) {
        const container = document.getElementById(containerId);
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = "bg-white p-3 rounded-xl shadow-sm border border-gray-100 item-block";
            div.id = `block_${item.id}`;
            
            let btnHtml = '';
            for(let i=1; i<=item.max; i++) {
                btnHtml += `<button type="button" onclick="setScore('${item.id}', ${i})" id="btn_${item.id}_${i}" class="score-btn">${i}</button>`;
            }

            let descHtml = `<div class="grid grid-cols-2 gap-2 mt-2 text-[10px] text-gray-500 bg-gray-50 p-2 rounded">`;
            item.steps.forEach((s, idx) => {
                descHtml += `<div><strong>${s} แต้ม:</strong> ${item.desc[idx]}</div>`;
            });
            descHtml += `</div>`;

            div.innerHTML = `
                <div class="flex justify-between items-center mb-2" onclick="toggleDesc('${item.id}')">
                    <span class="font-bold text-gray-700">${item.title}</span>
                    <i class="fas fa-info-circle text-gray-300" id="icon_${item.id}"></i>
                </div>
                <div class="flex flex-wrap gap-2 justify-center py-2 border-y border-dashed border-gray-100">${btnHtml}</div>
                <div id="desc_${item.id}" class="desc-content">${descHtml}</div>
            `;
            container.appendChild(div);
        });
    }

    // --- ระบบเลือกผู้ประเมิน ---
    function updateEvaluatorDropdown() {
        const team = document.getElementById('teamSelect').value;
        const evalSelect = document.getElementById('evaluatorSelect');
        const areaSelect = document.getElementById('areaSelect');
        
        evalSelect.innerHTML = '<option value="">-- เลือกผู้ประเมิน --</option>';
        areaSelect.innerHTML = '<option value="">-- เลือกพื้นที่ --</option>';

        if(team) {
            const data = CONFIG[`team${team}`];
            data.evaluators.forEach(e => evalSelect.innerHTML += `<option value="${e}">${e}</option>`);
            data.areas.forEach(a => areaSelect.innerHTML += `<option value="${a}">${a}</option>`);
        }
    }

    function saveInitialData() {
        const team = document.getElementById('teamSelect').value;
        const name = document.getElementById('evaluatorSelect').value;
        if(!team || !name) return alert("กรุณาระบุข้อมูลให้ครบถ้วน");
        
        document.getElementById('displayEvaluator').innerText = `ผู้ประเมิน: ${name} (ทีม ${team})`;
        goToPage(2);
    }

    // --- ระบบให้คะแนน ---
    function setScore(id, value) {
        // อัปเดต UI ปุ่ม
        const group = document.querySelectorAll(`[id^="btn_${id}_"]`);
        group.forEach(b => b.classList.remove('selected'));
        document.getElementById(`btn_${id}_${value}`).classList.add('selected');
        
        // บันทึกค่า
        state.scores[id] = value;
        
        // ซ่อนคำอธิบายอัตโนมัติเมื่อเลือกแล้ว (เพื่อให้ประเมินข้อถัดไปได้ง่าย)
        document.getElementById(`desc_${id}`).style.display = 'none';
        
        calcAll();
    }

    function toggleDesc(id) {
        const d = document.getElementById(`desc_${id}`);
        d.style.display = (d.style.display === 'none') ? 'block' : 'none';
    }

    function calcAll() {
        const sum = (list) => list.reduce((a, b) => a + (state.scores[b.id] || 0), 0);
        
        const s1 = sum(CONFIG.criteria.sec1);
        const s2 = sum(CONFIG.criteria.sec2);
        const s3 = sum(CONFIG.criteria.sec3);

        document.getElementById('sum5s').innerText = s1;
        document.getElementById('sumSafety').innerText = s2;
        document.getElementById('sumInno').innerText = s3;
        document.getElementById('grandTotal').innerText = s1 + s2 + s3;
    }

    // --- การบันทึกข้อมูล ---
    async function submitAssessment() {
        const area = document.getElementById('areaSelect').value;
        if(!area) return alert("กรุณาเลือกพื้นที่ประเมิน");

        // ตรวจสอบคะแนนว่ากรอกครบทุกข้อไหม
        const allCriteria = [...CONFIG.criteria.sec1, ...CONFIG.criteria.sec2, ...CONFIG.criteria.sec3];
        for(let item of allCriteria) {
            if(!state.scores[item.id]) {
                alert(`กรุณาให้คะแนนในหัวข้อ: ${item.title}`);
                document.getElementById(`block_${item.id}`).scrollIntoView({behavior:'smooth', block:'center'});
                return;
            }
        }

        // เตรียมก้อนข้อมูลบันทึก
        const record = {
            id: Date.now(),
            team: document.getElementById('teamSelect').value,
            evaluator: document.getElementById('evaluatorSelect').value,
            date: document.getElementById('evalDate').value,
            area: area,
            scores: {...state.scores},
            total: document.getElementById('grandTotal').innerText,
            notes: document.getElementById('notes').value,
            images: [...state.images],
            timestamp: new Date().toLocaleString('th-TH')
        };

        // บันทึกลง Local Storage
        const db = JSON.parse(localStorage.getItem(state.dbKey) || "[]");
        db.push(record);
        localStorage.setItem(state.dbKey, JSON.stringify(db));

        // แจ้งเตือนและเคลียร์หน้าจอ
        alert("บันทึกผลการประเมินเรียบร้อยแล้ว");
        resetForm();
        goToPage(3); // พาไปหน้ารายการโดยอัตโนมัติ
    }

    function resetForm() {
        state.scores = {};
        state.images = [];
        document.getElementById('notes').value = '';
        document.getElementById('areaSelect').selectedIndex = 0;
        document.getElementById('preview').innerHTML = '';
        document.getElementById('imgInput').value = '';
        
        // รีเซ็ต UI ปุ่ม
        document.querySelectorAll('.score-btn').forEach(b => b.classList.remove('selected'));
        // เปิดคำอธิบายกลับมา
        document.querySelectorAll('.desc-content').forEach(d => d.style.display = 'block');
        
        calcAll();
    }

    // --- ระบบอื่นๆ (รูปภาพ / การแสดงผลหน้า) ---
    function goToPage(n) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(`page${n}`).classList.add('active');
        window.scrollTo(0,0);
        if(n === 3) renderList();
    }

    async function handleImages(input) {
        const files = Array.from(input.files).slice(0, 7);
        state.images = [];
        const prevDiv = document.getElementById('preview');
        prevDiv.innerHTML = '';
        
        for(let f of files) {
            const base64 = await toBase64(f);
            state.images.push(base64);
            const img = document.createElement('img');
            img.src = base64;
            img.className = "w-16 h-16 object-cover rounded-lg border";
            prevDiv.appendChild(img);
        }
    }

    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });

    function renderList() {
        const db = JSON.parse(localStorage.getItem(state.dbKey) || "[]");
        const list = document.getElementById('historyList');
        const search = document.getElementById('searchArea').value.toLowerCase();
        list.innerHTML = '';

        db.filter(r => r.area.toLowerCase().includes(search)).reverse().forEach(r => {
            const div = document.createElement('div');
            div.className = "bg-white p-4 rounded-xl border-l-4 border-blue-500 shadow-sm flex justify-between items-center";
            div.innerHTML = `
                <div>
                    <div class="font-bold">${r.area}</div>
                    <div class="text-xs text-gray-500">ผู้ประเมิน: ${r.evaluator} | คะแนน: ${r.total}</div>
                    <div class="text-[10px] text-gray-400 mt-1">${r.timestamp}</div>
                </div>
                <button onclick="deleteRecord(${r.id})" class="text-red-400"><i class="fas fa-trash"></i></button>
            `;
            list.appendChild(div);
        });
    }

    function deleteRecord(id) {
        if(!confirm("ลบข้อมูลนี้หรือไม่?")) return;
        let db = JSON.parse(localStorage.getItem(state.dbKey) || "[]");
        db = db.filter(r => r.id !== id);
        localStorage.setItem(state.dbKey, JSON.stringify(db));
        renderList();
    }

    function loadAutoSaveInfo() {
        const db = JSON.parse(localStorage.getItem(state.dbKey) || "[]");
        if(db.length > 0) {
            document.getElementById('autoSaveLabel').innerText = `บันทึกอัตโนมัติล่าสุด: ${db[db.length-1].timestamp}`;
        }
    }
</script>
</body>
</html>
